{% extends "base.html" %}
{% block title %}Inscription – Gym Tracker{% endblock %}
{% block content %}
<div class="form-container">
    <h2>Inscription</h2>
    <form method="post">
        <input name="username" placeholder="Pseudo" required>
        <input name="password" type="password" placeholder="Mot de passe" required>
        <p class="password-hint">Minimum 6 caractères</p>
        <button type="submit">Créer le compte</button>
    </form>
    <p class="switch-link">Déjà membre ? <a href="{{ url_for('login') }}">Connecte-toi</a></p>
</div>
{% endblock %}
