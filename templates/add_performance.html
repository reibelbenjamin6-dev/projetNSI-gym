{% extends "base.html" %}
{% block title %}Nouvelle performance – Gym Tracker{% endblock %}
{% block content %}
<div class="form-container">
    <h2>➕ Nouvelle séance</h2>
    <form method="POST">
        <label>Exercice</label>
        <select name="exercise_id" required>
            {% for exercise in exercises %}
                <option value="{{ exercise.id }}">{{ exercise.name }} - {{ exercise.muscle }}</option>
            {% endfor %}
        </select>

        <label>Poids (kg)</label>
        <input type="number" name="weight" step="0.5" required>

        <label>Répétitions</label>
        <input type="number" name="reps" required>

        <button type="submit" class="btn-primary">Enregistrer</button>
    </form>
    <p class="switch-link"><a href="/dashboard">← Retour au dashboard</a></p>
</div>
{% endblock %}
